[workspace]
resolver = "3"
members = [
    "crates/unlade-cli",
    "crates/unlade-core",
    "crates/unlade-crates-parser",
    "crates/unlade-dependencies-parser",
    "crates/unlade-parser",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cazeth/unlade"
homepage = "https://github.com/cazeth/unlade"
readme = "README.md"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
miette = { version = "7.6.0", features = ["fancy"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
unlade-parser = { version = "0.1.0", path = "crates/unlade-parser" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
